<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<meta name="mobile-web-app-capable" content="yes">
<title>Desk Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #04070b;
  --eye: #8ef0ff;
  --love: #ff7fb0;
  --ui: #93a4b3;
  --panel: #0d141c;
  --line: #1d2a36;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ui); font-family: var(--mono);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
#face { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#handle {
  position: fixed; right: calc(env(safe-area-inset-right, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--ui); font: 600 14px var(--mono); cursor: pointer; opacity: .25;
}
#tray {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 12px; transform: translateY(105%); transition: transform .25s ease;
}
#tray.open { transform: translateY(0); }
.row { display: grid; gap: 7px; }
.label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 13px var(--mono); color: var(--ui); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 12px; cursor: pointer;
}
.chip.on { color: var(--bg); background: var(--eye); border-color: var(--eye); }
.hint { font-size: 11px; line-height: 1.5; opacity: .55; margin: 0; }
</style>
</head>
<body>
<canvas id="face" aria-label="Animated desk buddy eyes"></canvas>
<button id="handle" aria-label="Show controls">•••</button>

<div id="tray" role="region" aria-label="Controls">
  <div class="row">
    <span class="label">Mood</span>
    <div class="chips" id="moods"></div>
  </div>
  <div class="row">
    <span class="label">Display</span>
    <div class="chips">
      <button class="chip" id="tClock">Clock</button>
      <button class="chip" id="tNight">Sleep at night</button>
      <button class="chip" id="tFull">Full screen</button>
    </div>
  </div>
  <p class="hint">Tap: happy · double-tap: hearts · poke 6 times: grumpy · drag: eyes follow. Auto mode changes moods on its own and sleeps 11 pm–6 am.</p>
</div>

<script>
(() => {
  // ---------- settings (remembered on this device) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('buddy.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('buddy.' + k, JSON.stringify(v)); } catch {} }
  };
  const settings = { clock: store.get('clock', true), night: store.get('night', true), pinned: store.get('pinned', 'auto') };

  const cvs = document.getElementById('face');
  const ctx = cvs.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const COL = { eye: css.getPropertyValue('--eye').trim(), love: css.getPropertyValue('--love').trim(), ui: css.getPropertyValue('--ui').trim() };
  const FONT = css.getPropertyValue('--mono');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);   // fewer pixels to draw; still sharp for soft shapes
    W = innerWidth; H = innerHeight;
    for (const c of [cvs, off]) { c.width = W * DPR; c.height = H * DPR; }
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  }
  addEventListener('resize', resize); resize();

  // ---------- moods ----------
  const MOODS = {
    normal:    { top: 0,    slant: 0,     bottom: 0, scale: 1,    heart: 0 },
    happy:     { top: 0,    slant: 0,     bottom: 1, scale: 1.03, heart: 0 },
    sad:       { top: 0.30, slant: -0.24, bottom: 0, scale: 0.94, heart: 0 },
    angry:     { top: 0.28, slant: 0.30,  bottom: 0, scale: 0.97, heart: 0 },
    sleepy:    { top: 0.52, slant: 0.02,  bottom: 0, scale: 1,    heart: 0 },
    surprised: { top: 0,    slant: 0,     bottom: 0, scale: 1.2,  heart: 0 },
    love:      { top: 0,    slant: 0,     bottom: 0, scale: 1,    heart: 1 },
    curious:   { top: 0.08, slant: -0.08, bottom: 0, scale: 1.05, heart: 0 },
    asleep:    { top: 0.93, slant: 0,     bottom: 0, scale: 1,    heart: 0 },
  };
  const PICKABLE = ['auto', 'normal', 'happy', 'sad', 'angry', 'sleepy', 'surprised', 'love'];

  const cur = { ...MOODS.normal };
  let target = MOODS.normal, moodName = 'normal', moodUntil = 0;
  function show(name, ms) { moodName = name; target = MOODS[name]; moodUntil = ms ? performance.now() + ms : 0; }

  // ---------- time of day ----------
  function phase() {
    if (!settings.night) return 'day';
    const h = new Date().getHours();
    if (h >= 23 || h < 6) return 'night';
    if (h >= 22) return 'evening';
    return 'day';
  }

  // ---------- autonomous behaviour ----------
  let nextIdleMood = performance.now() + 15000, wokenUntil = 0;
  function resting() {
    if (settings.pinned !== 'auto') return settings.pinned;
    const p = phase();
    if (performance.now() < wokenUntil) return 'normal';
    if (p === 'night') return 'asleep';
    if (p === 'evening') return 'sleepy';
    return 'normal';
  }
  function behave(now) {
    if (moodUntil && now > moodUntil) moodUntil = 0;
    if (moodUntil) return;
    const rest = resting();
    if (moodName !== rest) show(rest);
    if (settings.pinned === 'auto' && rest === 'normal' && now > nextIdleMood) {
      const pick = ['happy', 'curious', 'curious', 'surprised', 'sleepy', 'love'][Math.floor(Math.random() * 6)];
      show(pick, pick === 'sleepy' ? 4000 : 2200);
      nextIdleMood = now + 25000 + Math.random() * 50000;
    }
  }

  // ---------- gaze ----------
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  let nextWander = 0, following = false;
  function wander(now) {
    if (following || moodName === 'asleep') { if (moodName === 'asleep') { look.tx = 0; look.ty = 0.15; } return; }
    if (now > nextWander) {
      if (Math.random() < 0.35) { look.tx = 0; look.ty = 0; }
      else { look.tx = (Math.random() * 2 - 1) * 0.9; look.ty = (Math.random() * 2 - 1) * 0.6; }
      nextWander = now + 1200 + Math.random() * 3200;
    }
  }

  // ---------- blink ----------
  let blinkT = -1, nextBlink = performance.now() + 2000;
  function blinkAmount(now) {
    if (blinkT < 0 && now > nextBlink && moodName !== 'asleep') blinkT = now;
    if (blinkT < 0) return 1;
    const d = (now - blinkT) / 170;
    if (d >= 1) { blinkT = -1; nextBlink = now + (Math.random() < 0.18 ? 140 : 1800 + Math.random() * 4200); return 1; }
    return Math.abs(Math.cos(d * Math.PI)) * 0.92 + 0.08;
  }

  // ---------- drawing ----------
  function rrect(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function heart(c, cx, cy, s) {
    c.beginPath();
    c.moveTo(cx, cy + s * 0.35);
    c.bezierCurveTo(cx - s * 1.1, cy - s * 0.35, cx - s * 0.45, cy - s * 1.05, cx, cy - s * 0.45);
    c.bezierCurveTo(cx + s * 0.45, cy - s * 1.05, cx + s * 1.1, cy - s * 0.35, cx, cy + s * 0.35);
    c.closePath();
  }
  function drawEye(c, cx, cy, w, h, side, m, t) {
    const x = cx - w / 2, y = cy - h / 2;
    if (m.heart > 0.5) { heart(c, cx, cy + h * 0.08, w * 0.62 * (1 + Math.sin(t / 160) * 0.06)); c.fill(); return; }
    rrect(c, x, y, w, h, w * 0.24); c.fill();
    c.save(); c.globalCompositeOperation = 'destination-out';
    const outerY = y + m.top * h, innerY = y + (m.top + m.slant) * h, lx = x - 4, rx = x + w + 4;
    c.beginPath(); c.moveTo(lx, y - 4); c.lineTo(rx, y - 4);
    if (side < 0) { c.lineTo(rx, innerY); c.lineTo(lx, outerY); } else { c.lineTo(rx, outerY); c.lineTo(lx, innerY); }
    c.closePath(); c.fill();
    if (m.bottom > 0.01) { c.beginPath(); c.ellipse(cx, y + h + h * 0.62 - m.bottom * h * 0.58, w * 0.78, h * 0.62, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  function hexMix(a, b, k) {
    const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join('');
  }

  let colorK = 0, dim = 1, lastT = performance.now();
  // Battery: draw at 30 fps normally, 8 fps while asleep or when nothing is moving much
  function frameInterval() {
    if (following || blinkT >= 0) return 1000 / 30;
    if (moodName === 'asleep') return 1000 / 8;
    return 1000 / 30;
  }
  function frame(now) {
    if (now - lastT < frameInterval() - 2) { requestAnimationFrame(frame); return; }
    const dt = Math.min(140, now - lastT); lastT = now;
    const k = 1 - Math.pow(0.001, dt / 260);
    behave(now); wander(now);
    for (const key in cur) cur[key] = lerp(cur[key], target[key], k);
    const gk = 1 - Math.pow(0.001, dt / (following ? 90 : 180));
    look.x = lerp(look.x, look.tx, gk); look.y = lerp(look.y, look.ty, gk);
    colorK = lerp(colorK, moodName === 'love' ? 1 : 0, k);
    const color = hexMix(COL.eye, COL.love, colorK);

    // burn-in care: slow drift of the whole face, dimmer at night
    const driftX = Math.sin(now / 97000) * 14, driftY = Math.cos(now / 131000) * 10;
    const p = phase();
    dim = lerp(dim, p === 'night' ? 0.28 : p === 'evening' ? 0.6 : 1, 0.02);

    const base = Math.min(W * 0.27, H * 0.36), gap = base * 0.38;
    const breathe = 1 + Math.sin(now / 1400) * 0.012, blink = blinkAmount(now);
    const cx = W / 2 + driftX + look.x * Math.min(W * 0.12, base * 0.6);
    const cy = H / 2 + driftY - (settings.clock ? H * 0.04 : 0) + look.y * Math.min(H * 0.1, base * 0.35);

    octx.setTransform(DPR, 0, 0, DPR, 0, 0); octx.clearRect(0, 0, W, H); octx.fillStyle = color;
    for (const side of [-1, 1]) {
      const curious = 1 + Math.max(0, side * look.x) * 0.12 - Math.max(0, -side * look.x) * 0.05;
      const s = cur.scale * breathe * curious;
      drawEye(octx, cx + side * (gap / 2 + base / 2), cy, base * s, base * 1.08 * s * blink, side, cur, now);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.globalAlpha = dim;
    // glow is the most expensive part of each frame; keep it smaller and skip it while asleep
    ctx.shadowColor = color; ctx.shadowBlur = moodName === 'asleep' ? 0 : 18 * DPR; ctx.drawImage(off, 0, 0); ctx.shadowBlur = 0;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (moodName === 'asleep') {
      ctx.fillStyle = color; ctx.font = `600 ${Math.round(base * 0.22)}px ${FONT}`;
      for (let i = 0; i < 3; i++) {
        const q = ((now / 2400) + i / 3) % 1;
        ctx.globalAlpha = Math.sin(q * Math.PI) * 0.7 * dim;
        ctx.fillText('z', cx + base * 1.15 + q * base * 0.35, cy - base * 0.3 - q * base * 0.55);
      }
    }
    if (settings.clock) {
      const d = new Date();
      ctx.globalAlpha = 0.45 * dim; ctx.fillStyle = COL.ui; ctx.textAlign = 'center';
      ctx.font = `500 ${Math.round(Math.min(W, H) * 0.06)}px ${FONT}`;
      ctx.fillText(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), W / 2 + driftX, H * 0.88 + driftY);
      ctx.font = `400 ${Math.round(Math.min(W, H) * 0.028)}px ${FONT}`;
      ctx.fillText(d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' }), W / 2 + driftX, H * 0.88 + driftY + Math.min(W, H) * 0.045);
      ctx.textAlign = 'start';
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- touch ----------
  let downAt = 0, downX = 0, downY = 0, lastTap = 0, pokes = [];
  function aimAt(px, py) {
    look.tx = Math.max(-1, Math.min(1, (px - W / 2) / (W * 0.35)));
    look.ty = Math.max(-1, Math.min(1, (py - H / 2) / (H * 0.35)));
  }
  cvs.addEventListener('pointerdown', e => {
    downAt = performance.now(); downX = e.clientX; downY = e.clientY;
    following = true; aimAt(e.clientX, e.clientY); closeTray(); keepAwake();
  });
  cvs.addEventListener('pointermove', e => { if (following) aimAt(e.clientX, e.clientY); });
  addEventListener('pointerup', e => {
    if (!following) return;
    following = false; nextWander = performance.now() + 1500;
    const now = performance.now();
    if (moodName === 'asleep' || moodName === 'sleepy') { wokenUntil = now + 20000; show('surprised', 900); return; }
    if (now - downAt > 300 || Math.hypot(e.clientX - downX, e.clientY - downY) > 18) return;
    pokes = pokes.filter(t => now - t < 2500); pokes.push(now);
    if (pokes.length >= 6) { pokes = []; show('angry', 2600); return; }
    show(now - lastTap < 320 ? 'love' : 'happy', now - lastTap < 320 ? 2600 : 1500);
    lastTap = now;
  });

  // ---------- controls ----------
  const tray = document.getElementById('tray');
  let trayTimer;
  const openTray = () => { tray.classList.add('open'); bump(); };
  const closeTray = () => tray.classList.remove('open');
  const bump = () => { clearTimeout(trayTimer); trayTimer = setTimeout(closeTray, 8000); };
  document.getElementById('handle').addEventListener('click', () => tray.classList.contains('open') ? closeTray() : openTray());
  tray.addEventListener('pointerdown', bump);

  const moodsEl = document.getElementById('moods');
  for (const m of PICKABLE) {
    const b = document.createElement('button');
    b.className = 'chip'; b.id = 'mood-' + m; b.textContent = m[0].toUpperCase() + m.slice(1);
    b.addEventListener('click', () => { settings.pinned = m; store.set('pinned', m); moodUntil = 0; render(); });
    moodsEl.appendChild(b);
  }
  const tClock = document.getElementById('tClock'), tNight = document.getElementById('tNight');
  tClock.addEventListener('click', () => { settings.clock = !settings.clock; store.set('clock', settings.clock); render(); });
  tNight.addEventListener('click', () => { settings.night = !settings.night; store.set('night', settings.night); render(); });
  document.getElementById('tFull').addEventListener('click', async () => {
    try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch {}
  });
  function render() {
    for (const m of PICKABLE) document.getElementById('mood-' + m).classList.toggle('on', settings.pinned === m);
    tClock.classList.toggle('on', settings.clock);
    tNight.classList.toggle('on', settings.night);
  }
  render();

  // ---------- keep the screen on while the page is visible ----------
  let lock = null;
  async function keepAwake() {
    if (lock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();
})();
</script>
</body>
</html>
