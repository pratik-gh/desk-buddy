<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<!-- Policy from the camera handoff, unchanged. worker-src blob: is needed: camera.js starts
     the detection worker from a blob: URL so this policy also covers it (it blocks
     MediaPipe's usage logging to Google). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Desk Buddy</title>
<link rel="stylesheet" href="buddy.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="camDot" hidden></div>

<div id="panel" hidden>
  <div class="head"><h3>Mood</h3><button id="close">Done</button></div>
  <div id="moods"></div>
  <div class="opts">
    <label><input type="checkbox" id="optClock"> Clock</label>
    <label><input type="checkbox" id="opt24"> 24-hour</label>
    <label>Font <select id="optFont">
      <option value="sans">Sans</option>
      <option value="thin">Thin</option>
      <option value="serif">Serif</option>
      <option value="mono">Mono</option>
    </select></label>
    <label>Size <select id="optSize">
      <option value="small">Small</option>
      <option value="medium">Medium</option>
      <option value="large">Large</option>
    </select></label>
  </div>
  <div class="opts">
    <label>Face <select id="optStyle">
      <option value="classic">Classic</option>
      <option value="yellow">Yellow</option>
    </select></label>
    <label><input type="checkbox" id="optCam"> Camera</label>
    <label><input type="checkbox" id="optFlip"> Flip camera direction</label>
  </div>
  <p id="camMsg"></p>
</div>

<script type="module" src="buddy.js"></script>
</body>
</html>
